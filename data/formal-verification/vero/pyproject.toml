[project]
name = "anarres-formal"
version = "0.2.0"
description = "Anarres adapter for Vero source and runtime qualification"
requires-python = ">=3.11"
dependencies = ["anarres-core", "anarres-environments"]
license = { text = "Apache-2.0" }

[project.scripts]
anarres-formal = "anarres_formal_adapter.cli:main"
anarres-formal-fixture = "anarres_formal_adapter.fixture_cli:main"
formal-fixture-runner = "anarres_formal_adapter.fixture:runner_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres_formal_adapter"]
